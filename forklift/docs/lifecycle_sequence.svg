<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="seq-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="seq-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1100" height="640" fill="#ffffff" rx="12"/>

  <!-- Lifelines -->
  <line x1="145" y1="68" x2="145" y2="615" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,5"/>
  <line x1="415" y1="68" x2="415" y2="615" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,5"/>
  <line x1="685" y1="68" x2="685" y2="615" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,5"/>
  <line x1="955" y1="68" x2="955" y2="615" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,5"/>

  <!-- Actor Headers -->
  <rect x="40" y="20" width="210" height="48" rx="8" fill="#0f172a"/>
  <text x="145" y="49" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">Forklift Sensors / CAN</text>

  <rect x="310" y="20" width="210" height="48" rx="8" fill="#1d4ed8"/>
  <text x="415" y="49" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">SiMa.ai Edge Orchestrator</text>

  <rect x="580" y="20" width="210" height="48" rx="8" fill="#047857"/>
  <text x="685" y="49" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">Qdrant Edge (Disk)</text>

  <rect x="850" y="20" width="210" height="48" rx="8" fill="#334155"/>
  <text x="955" y="49" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">Jungheinrich WES</text>

  <!-- Phase 1 -->
  <rect x="24" y="84" width="1052" height="96" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="40" y="106" fill="#1e40af" font-size="12.5" font-weight="700">PHASE 1: FEW-SHOT SKU / HAZARD ENROLLMENT</text>
  <line x1="955" y1="126" x2="421" y2="126" stroke="#1e293b" stroke-width="2" marker-end="url(#seq-arrow)"/>
  <text x="688" y="120" text-anchor="middle" fill="#0f172a" font-size="12.5">MQTT: enroll_sku (2–3 ref vectors: "damaged_euro_pallet")</text>
  <line x1="415" y1="158" x2="679" y2="158" stroke="#059669" stroke-width="2" marker-end="url(#seq-green)"/>
  <text x="550" y="152" text-anchor="middle" fill="#065f46" font-size="12.5">Upsert (ephemeral=False) + flush() to disk</text>

  <!-- Phase 2 -->
  <rect x="24" y="194" width="1052" height="148" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
  <text x="40" y="216" fill="#854d0e" font-size="12.5" font-weight="700">PHASE 2: OFFLINE AISLE OPERATION (WI-FI DEAD ZONE)</text>
  <line x1="145" y1="238" x2="409" y2="238" stroke="#1e293b" stroke-width="2" marker-end="url(#seq-arrow)"/>
  <text x="280" y="232" text-anchor="middle" fill="#0f172a" font-size="12.5">CAN-Bus + Operator Voice Note</text>
  <line x1="415" y1="264" x2="679" y2="264" stroke="#059669" stroke-width="2" marker-end="url(#seq-green)"/>
  <text x="550" y="258" text-anchor="middle" fill="#065f46" font-size="12.5">Upsert to forklift_ops_lane &amp; forklift_audio_lane</text>
  <line x1="145" y1="296" x2="409" y2="296" stroke="#1e293b" stroke-width="2" marker-end="url(#seq-arrow)"/>
  <text x="280" y="290" text-anchor="middle" fill="#0f172a" font-size="12.5">Camera Frame (Aisle 4 Obstruction)</text>
  <line x1="415" y1="322" x2="679" y2="322" stroke="#059669" stroke-width="2" marker-end="url(#seq-green)"/>
  <text x="550" y="316" text-anchor="middle" fill="#065f46" font-size="12.5">Query vision_lane (≥0.82 match | 0.60–0.81 unknown) &amp; Upsert (ephemeral=True)</text>

  <!-- Phase 3 -->
  <rect x="24" y="356" width="1052" height="138" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="378" fill="#334155" font-size="12.5" font-weight="700">PHASE 3: CROSS-LANE FUSION &amp; ASYNC WES SYNC</text>
  <line x1="685" y1="400" x2="421" y2="400" stroke="#1e293b" stroke-width="2" marker-end="url(#seq-arrow)"/>
  <text x="550" y="394" text-anchor="middle" fill="#0f172a" font-size="12.5">Retrieve correlated vision + audio + task context (with freshness decay)</text>
  <rect x="315" y="414" width="200" height="30" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="415" y="434" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="600">Queue in SQLite Outbox</text>
  <line x1="415" y1="472" x2="949" y2="472" stroke="#1e293b" stroke-width="2" marker-end="url(#seq-arrow)"/>
  <text x="685" y="466" text-anchor="middle" fill="#0f172a" font-size="12.5">On Wi-Fi Resume → FIFO Drain → MQTT: EDGE_SEMANTIC_INCIDENT</text>

  <!-- Phase 4 -->
  <rect x="24" y="508" width="1052" height="100" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="40" y="530" fill="#991b1b" font-size="12.5" font-weight="700">PHASE 4: DYNAMIC STATE PRUNING ("FORGET" TRIGGER)</text>
  <line x1="955" y1="554" x2="421" y2="554" stroke="#dc2626" stroke-width="2" marker-end="url(#seq-red)"/>
  <text x="688" y="548" text-anchor="middle" fill="#991b1b" font-size="12.5">MQTT: forget_zone ({"zone_id": "AISLE-04"})</text>
  <line x1="415" y1="586" x2="679" y2="586" stroke="#dc2626" stroke-width="2" marker-end="url(#seq-red)"/>
  <text x="550" y="580" text-anchor="middle" fill="#991b1b" font-size="12.5">Delete where zone_id="AISLE-04" AND ephemeral=True (keeps few-shot refs)</text>
</svg>

