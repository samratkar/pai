[project]
name = "sima-jh-edge-memory"
version = "0.1.0"
description = "Edge-Native Semantic Memory for Jungheinrich Forklifts on SiMa.ai MLSoC + Qdrant Edge + WES"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
qdrant = ["qdrant-edge>=0.1.0", "qdrant-client>=1.9.0", "fastembed>=0.3.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

